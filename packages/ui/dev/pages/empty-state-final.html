<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IcePaw · 开始一段新对话</title>
  <style>
    /* ========= Design Tokens ========= */
    :root {
      --blue:        #3B82F6;
      --blue-dark:   #2563EB;
      --blue-soft:   #EFF6FF;

      --gray-50:     #F8FAFC;
      --gray-100:    #F1F5F9;
      --gray-200:    #E2E8F0;
      --gray-300:    #CBD5E1;
      --gray-400:    #94A3B8;
      --gray-500:    #64748B;
      --gray-600:    #475569;
      --gray-700:    #334155;
      --gray-800:    #1E293B;
      --gray-900:    #0F172A;
    }

    /* ========= Reset ========= */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: #FAFAF9;
      color: var(--gray-900);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* ========= Layout ========= */
    .app {
      display: flex;
      height: 100vh;
      min-height: 640px;
    }

    /* ========= Sidebar ========= */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: #FFFFFF;
      border-right: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #60A5FA 0%, #2563EB 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.25);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-900);
      letter-spacing: -0.01em;
    }

    .new-chat-btn {
      margin: 4px 16px 14px;
      padding: 10px 12px;
      background: var(--blue);
      color: #FFFFFF;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .new-chat-btn:hover {
      background: var(--blue-dark);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding-bottom: 8px;
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: var(--gray-200);
      border-radius: 3px;
    }

    .section-label {
      padding: 8px 26px 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-400);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .conv-list {
      padding: 0 10px;
    }

    .conv-item {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13.5px;
      color: var(--gray-700);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .conv-item:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FCA5A5 0%, #F87171 100%);
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-900);
      line-height: 1.3;
    }

    .user-plan {
      font-size: 11.5px;
      color: var(--gray-500);
      line-height: 1.3;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-500);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    /* ========= Main ========= */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #FAFAF9;
    }

    .topbar {
      height: 56px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .model-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--gray-900);
      background: #FFFFFF;
      transition: background 0.15s ease;
    }

    .model-pill:hover {
      background: var(--gray-50);
    }

    .model-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .top-actions {
      display: flex;
      gap: 4px;
    }

    /* ========= Empty State ========= */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      overflow-y: auto;
    }

    .empty-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 520px;
      width: 100%;
    }

    .illustration {
      width: 240px;
      height: 200px;
      margin-bottom: 28px;
      display: block;
    }

    .empty-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--gray-900);
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    .empty-subtitle {
      font-size: 14px;
      color: var(--gray-500);
      line-height: 1.7;
      text-align: center;
      max-width: 440px;
      margin-bottom: 28px;
    }

    .cta-btn {
      padding: 11px 26px;
      background: var(--blue);
      color: #FFFFFF;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(59, 130, 246, 0.25),
                  0 4px 12px rgba(59, 130, 246, 0.15);
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
    }

    .cta-btn:hover {
      background: var(--blue-dark);
      box-shadow: 0 2px 4px rgba(59, 130, 246, 0.35),
                  0 6px 16px rgba(59, 130, 246, 0.25);
    }

    .cta-btn:active {
      transform: translateY(1px);
    }

    /* ========= Hand-drawn Cursor Blink ========= */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s steps(1, end) infinite;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ========== Sidebar ========== -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1.2 L9.6 5.4 L14 5.6 L10.5 8.8 L11.6 13.4 L8 10.8 L4.4 13.4 L5.5 8.8 L2 5.6 L6.4 5.4 Z"
                  fill="currentColor"/>
          </svg>
        </div>
        <span class="brand-name">IcePaw</span>
      </div>

      <button class="new-chat-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        新建对话
      </button>

      <div class="sidebar-scroll">
        <div class="section-label">今天</div>
        <div class="conv-list">
          <div class="conv-item" title="帮我写一段产品介绍文案">帮我写一段产品介绍文案</div>
          <div class="conv-item" title="React Hooks 性能优化建议">React Hooks 性能优化建议</div>
          <div class="conv-item" title="翻译：清晨的咖啡馆">翻译：清晨的咖啡馆</div>
        </div>

        <div class="section-label">本周</div>
        <div class="conv-list">
          <div class="conv-item" title="解释一下量子纠缠的概念">解释一下量子纠缠的概念</div>
          <div class="conv-item" title="帮我写一份季度总结">帮我写一份季度总结</div>
          <div class="conv-item" title="Python 异步编程入门">Python 异步编程入门</div>
          <div class="conv-item" title="京都 5 日深度游攻略">京都 5 日深度游攻略</div>
          <div class="conv-item" title="设计系统：按钮组件规范">设计系统：按钮组件规范</div>
        </div>

        <div class="section-label">更早</div>
        <div class="conv-list">
          <div class="conv-item" title="重构遗留代码的思路">重构遗留代码的思路</div>
          <div class="conv-item" title="聊聊最近读的几本管理学书">聊聊最近读的几本管理学书</div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="avatar"></div>
        <div class="user-info">
          <div class="user-name">dabai</div>
          <div class="user-plan">Pro 套餐</div>
        </div>
        <button class="icon-btn" type="button" aria-label="设置">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2" fill="currentColor"/>
            <path d="M13.5 8a5.5 5.5 0 0 0-.13-1.2l1.25-1-1.5-2.6-1.5.5a5.5 5.5 0 0 0-1.9-1.1L9.3 1h-2.6l-.42 1.6a5.5 5.5 0 0 0-1.9 1.1l-1.5-.5L1.38 5.8l1.25 1A5.5 5.5 0 0 0 2.5 8c0 .42.05.82.13 1.2l-1.25 1 1.5 2.6 1.5-.5c.55.45 1.2.82 1.9 1.1l.42 1.6h2.6l.42-1.6a5.5 5.5 0 0 0 1.9-1.1l1.5.5 1.5-2.6-1.25-1c.08-.38.13-.78.13-1.2Z"
                  stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ========== Main ========== -->
    <main class="main">
      <header class="topbar">
        <button class="model-pill" type="button">
          <span class="model-dot"></span>
          IcePaw 4
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="top-actions">
          <button class="icon-btn" type="button" aria-label="分享">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M12 5 8 2 4 5M8 2v8M3 10v3h10v-3"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="icon-btn" type="button" aria-label="主题">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="2.6" stroke="currentColor" stroke-width="1.4"/>
              <path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"
                    stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon-btn" type="button" aria-label="更多">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <circle cx="3" cy="8" r="1.2"/>
              <circle cx="8" cy="8" r="1.2"/>
              <circle cx="13" cy="8" r="1.2"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="empty-state">
        <div class="empty-content">
          <!-- =============== Hand-drawn illustration =============== -->
          <svg class="illustration" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- ===== Decorative back layer ===== -->

            <!-- Sparkle top-right (cross + X for extra sparkle) -->
            <g stroke="#3B82F6" stroke-width="2" stroke-linecap="round" fill="none">
              <line x1="218" y1="20" x2="218" y2="36"/>
              <line x1="210" y1="28" x2="226" y2="28"/>
              <line x1="213" y1="23" x2="223" y2="33" opacity="0.55"/>
              <line x1="213" y1="33" x2="223" y2="23" opacity="0.55"/>
            </g>

            <!-- Star top-left -->
            <g stroke="#3B82F6" stroke-width="2" stroke-linecap="round" fill="none">
              <line x1="22" y1="14" x2="22" y2="32"/>
              <line x1="13" y1="23" x2="31" y2="23"/>
              <line x1="16" y1="17" x2="28" y2="29" opacity="0.55"/>
              <line x1="16" y1="29" x2="28" y2="17" opacity="0.55"/>
            </g>

            <!-- Tiny dot at top center -->
            <circle cx="120" cy="12" r="2.5" fill="#3B82F6" opacity="0.75"/>

            <!-- Wavy line on the right -->
            <path d="M222 100 q 4 -5, 8 0 t 8 0"
                  fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

            <!-- Wavy line on the left -->
            <path d="M6 120 q 4 -5, 8 0 t 8 0"
                  fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

            <!-- Scattered dots -->
            <circle cx="200" cy="180" r="2.2" fill="#334155" opacity="0.55"/>
            <circle cx="40"  cy="172" r="2"   fill="#334155" opacity="0.55"/>
            <circle cx="195" cy="50"  r="1.8" fill="#3B82F6" opacity="0.65"/>
            <circle cx="58"  cy="190" r="1.8" fill="#3B82F6" opacity="0.6"/>

            <!-- Small sparkle bottom-right -->
            <g stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" fill="none">
              <line x1="208" y1="170" x2="208" y2="180"/>
              <line x1="203" y1="175" x2="213" y2="175"/>
            </g>

            <!-- Tiny accent curl near top-right of bubble -->
            <path d="M198 24 q 4 -3, 7 1"
                  fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>

            <!-- ===== Main chat bubble ===== -->

            <!-- Soft shadow -->
            <path d="M 52 36 Q 37 36, 37 51 L 37 122 Q 37 137, 52 137 L 117 137 L 80 167 L 87 137 L 197 137 Q 212 137, 212 122 L 212 51 Q 212 36, 197 36 Z"
                  fill="rgba(15, 23, 42, 0.06)"/>

            <!-- Bubble fill (warm white) -->
            <path d="M 50 32 Q 35 32, 35 47 L 35 118 Q 35 133, 50 133 L 115 133 L 78 163 L 85 133 L 195 133 Q 210 133, 210 118 L 210 47 Q 210 32, 195 32 Z"
                  fill="#FFFDF9"/>

            <!-- Bubble outline (hand-drawn thick stroke with subtle dasharray) -->
            <path d="M 50 32 Q 35 32, 35 47 L 35 118 Q 35 133, 50 133 L 115 133 L 78 163 L 85 133 L 195 133 Q 210 133, 210 118 L 210 47 Q 210 32, 195 32 Z"
                  fill="none" stroke="#1E293B" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round"
                  stroke-dasharray="600 1.4"/>

            <!-- ===== Inside bubble ===== -->

            <!-- Three wavy "text" lines, third one short to suggest cursor follows -->
            <g stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none">
              <path d="M 58 64 Q 96 62, 138 64"/>
              <path d="M 58 85 Q 112 83, 168 85"/>
              <path d="M 58 106 Q 80 104, 100 106"/>
            </g>

            <!-- Blinking blue cursor -->
            <line x1="110" y1="99" x2="110" y2="115"
                  stroke="#3B82F6" stroke-width="3" stroke-linecap="round"
                  class="cursor"/>
          </svg>

          <h2 class="empty-title">开始一段新对话</h2>
          <p class="empty-subtitle">
            选择一个模型，输入你的问题或创意，IcePaw 会立刻回应你。一切从这里开始。
          </p>
          <button class="cta-btn" type="button">创建对话</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
