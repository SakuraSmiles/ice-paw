<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IcePaw</title>
    <!--
      首帧启动骨架（2026-09-07 白屏根治批；2026-09-16 加载页批次改造）：
      WebView 加载 HTML → JS bundle 执行完 → Vue mount 之间存在纯白窗口
      （低配机 1-2s）。此段内联样式 + 字标让首帧即有内容，先于一切加载逻辑可见。

      生命周期改造：骨架是 #app 的**兄弟节点**（body 直接子级）——Vue mount 只替换
      #app 内容，骨架不再被 mount 吞掉「一闪而过」；退场由 main.ts 接管——亮窗后
      最少展示 1s，再挂 .boot-splash-out 淡出并移除节点（JS 挂死时骨架留存 = 诚实的
      「启动中」而非空白窗）。pointer-events:none 保证任何时刻不挡输入。

      ⚠️ 全应用唯一硬编码颜色/系统字体栈/z-index 例外位：令牌体系（tokens.css /
      --ip-* / --ip-z-* / @fontsource 字体）全部打进 JS bundle，首帧必然不可用。
      色值抄 tokens.css：浅区 --ip-color-bg-primary #FAFBFC / --ip-primary-600 #173D66 /
      gray-200 #E6EAEF；暗区 [data-theme='dark'] 同名令牌 #14181F / #5B8FCC /
      gray-850 #1C222B。z-index 取高值压过 app 内一切 --ip-z-* 浮层（启动期一瞬，
      不进令牌体系）；首帧只能跟系统 prefers-color-scheme 走（app 自身主题在 JS
      加载后接管，有一帧切换可接受）；reduced-motion 静态降级与全局规范一致。
    -->
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fafbfc;
        color: #173d66;
      }
      /* 退场（main.ts 淡出后移除）：app 已就绪在骨架下方，交叉淡入无缝衔接 */
      .boot-splash-out {
        opacity: 0;
        transition: opacity 320ms ease-out;
      }
      .boot-logo {
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .boot-bar {
        width: 128px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: #e6eaef;
      }
      .boot-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #173d66;
        animation: boot-slide 1.4s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-color-scheme: dark) {
        .boot-splash { background: #14181f; color: #5b8fcc; }
        .boot-bar { background: #1c222b; }
        .boot-bar-fill { background: #5b8fcc; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar-fill { animation: none; transform: translateX(100%); }
        .boot-splash-out { transition: none; }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="boot-splash" class="boot-splash" aria-label="正在启动 IcePaw">
      <div class="boot-logo">IcePaw</div>
      <div class="boot-bar"><div class="boot-bar-fill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
