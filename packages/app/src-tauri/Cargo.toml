[package]
name = "ice-paw"
version = "0.6.0"
description = "IcePaw - 本地优先的 LLM 对话工作站"
authors = ["dabai"]
edition = "2021"

# 详见 https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# 使用 `_lib` 后缀让 lib name 与 bin name 不冲突（Windows 上必需）
name = "ice_paw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# === Tauri 主框架 ===
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-stronghold = "2"
# 直接依赖以拿到 `ClientError` 做强类型匹配 —— 启动恢复 `load_client`
# 时区分 "snapshot 里没有该 client" vs "snapshot 损坏/解密失败"。
# 版本对齐 transitive（tauri-plugin-stronghold 2.3.1 → iota_stronghold 2.1.0）。
iota_stronghold = "2.1"

# === 序列化 ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === 数据库（sqlx + 异步运行时）===
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }

# === 通用工具 ===
# scopeguard：RAII 守卫，用于 send_message 注册 CancellationToken 后保证任意早返回都注销（防会话卡死）
scopeguard = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# search_files 工具：正则内容搜索
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 磁盘日志（按天轮转 + 非阻塞写线程），见 logging.rs。
# tracing 生态官方 appender，与 tracing-subscriber 0.3 / tracing 0.1 版本兼容。
tracing-appender = "0.2"

# === HTTP / 流式 LLM ===
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# reqwest 0.12 已传递依赖 bytes，显式声明以在 `provider/anthropic/streaming.rs` 中命名 `bytes::Bytes`
# （用作 `parse_sse_stream<S: Stream<Item = Result<Bytes, _>>>` 的关联类型 bound）。
bytes = "1"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# === 密码学（用于 stronghold password → 32 字节 key 派生）===
# Stronghold 的 `KeyProvider::try_from` 要求密码恰好 32 字节，
# 这里用 blake2b256 把任意长度 passphrase 哈希到 32 字节后再传入，
# 既规避了"密码必须 32 字节"的 footgun，也与 stronghold 文档推荐做法一致。
blake2 = { version = "0.10", features = ["std"] }

# === memory_store 加密（XChaCha20-Poly1305，REQ-CHAT-048）===
# `memory_store.content_encrypted` 列使用 XChaCha20-Poly1305：
#   - key 派生自 blake2b256(DEFAULT_PASSPHRASE || MEMORY_KEY_DOMAIN)
#   - nonce 每次 encrypt 用 OsRng 生成 24 字节随机值并前置到密文
#   - Poly1305 tag 由 AEAD 自动追加到 ciphertext 末尾（16 字节固定）
#
# `chacha20poly1305 0.10.1` 已是 `iota_stronghold` 的传递依赖；显式声明为
# 直接依赖以拿到清晰语义版本，避免上游 transitive 漂移时无声 break。
chacha20poly1305 = "0.10"
# `OsRng` 在 rand 0.8 需 `getrandom` feature（默认 features 不含）。
rand = { version = "0.8", features = ["getrandom"] }

# === Base64 编解码（P2-2 图片尺寸校验）===
# 用于把客户端上传的 base64 编码图片解码为原始字节以校验大小。
# reqwest 0.12 已传递依赖 0.22，这里显式声明避免版本漂移。
base64 = "0.22"

# === 解析 agent.yaml 文件配置（Phase 3: 工作区行为配置）===
serde_yaml = "0.9"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# office/pdf 文档解析（read_file / KB 索引 / 聊天附件 共享 spine，见 harness/doc/）
# calamine 读 xlsx/xls/xlsb/ods；docx-rs 当前 docx 提取走 zip+XML 直读（见 docx.rs），
#   crate 保留作 Phase 4 写入 + 未来结构化读取；pdf-extract 提取 PDF 文本。
calamine = "0.36.1"
docx-rs = "0.4.22"
pdf-extract = "0.12.0"
# zip 与 docx-rs/calamine 传递依赖同版本（lockfile 8.6.0），显式声明以在 docx.rs 直读 word/document.xml。
zip = "8.6"
# docx 结构模型（word-capability-roadmap S0a）：document.xml → xml_dom 极小 DOM → 类型树。
# 版本与 lockfile 中 plist 传递依赖一致（0.41），零新增编译。
quick-xml = "0.41"
# Phase B：扫描件/图片型 PDF 视觉读取。pdfium-render 是 pdfium（Chrome PDF 引擎）的安全
# Rust wrapper，运行时动态加载 pdfium.dll（编译期不需要二进制）。
# ⚠️ feature 必须显式 pin pdfium_6721：crate 默认 pdfium_latest 会随版本漂移（0.8.37 时
#    已指向 chromium/7543），而 sodium-prebuilt/pdfium/bin/pdfium.dll 是 bblanchon chromium/6721
#    版——默认 feature 会绑定 7543 的函数签名，运行时 dll 缺符号 → bind_to_library 失败。
#    故 default-features=false + 显式 pdfium_6721 与已下载二进制对齐；thread_safe/image
#    是默认 features 里被关掉、本 crate 实际需要的两项（as_image()/PNG 编码）。
pdfium-render = { version = "0.8.27", default-features = false, features = ["pdfium_6721", "thread_safe", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-window-state = "2.4.1"

# === Windows 专用：系统 ANSI 代码页解码（MultiByteToWideChar + CP_ACP）===
# 仅 Windows target 引入，decode.rs 用它按「系统当前 ANSI 代码页」解码子进程
# 输出，自动适配任意语言版本的 Windows（中文=GBK、英文=1252、日文=Shift-JIS…）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # computer use（harness/mcp/screen）：DWM cloak 判定（list_windows 过滤 UWP 幽灵窗）/
    # 进程 pid（排除自身窗口）/ SendInput 鼠标键盘模拟 / PrintWindow（windows-sys 0.59
    # 把它放进了 Xps 打印路径的 feature，别处找不到）
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_Xps",
    # 真机冒烟测试（screen/real_smoke.rs）：测试进程无 tao 的运行时 DPI 感知设置，
    # 自己补设 PerMonitorV2 才与生产同坐标基准（DPI 缩放机器上否则拿到虚拟化坐标）
    "Win32_UI_HiDpi",
] }

# === 集成测试 ===
[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# 注：dev 上 iota_stronghold 依赖 scrypt 较慢，按官方推荐打开 opt-level=3
[profile.dev.package.scrypt]
opt-level = 3

[profile.ci]
inherits = "test"
debug = 0
strip = true
lto = "thin"
codegen-units = 1

[profile.release]
# unwind：让 dispatch_catch_panic 能兜住工具执行期的 panic（abort 模式下
# catch_unwind 捕获不到，进程直接退出 = 闪退）。代价仅二进制略增（栈展开元数据）。
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
