<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="ice-paw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FA1D6"/>
      <stop offset="100%" stop-color="#3565A8"/>
    </linearGradient>
  </defs>

  <!-- Ice-blue rounded square background -->
  <rect width="40" height="40" rx="10" fill="url(#ice-paw-bg)"/>

  <!-- Subtle top highlight (gives a frosted feel) -->
  <path d="M 0 10 Q 0 0, 10 0 L 30 0 Q 40 0, 40 10 L 40 18 Q 20 24, 0 18 Z" fill="white" opacity="0.08"/>

  <!-- Paw (white), slightly enlarged to fill the frame -->
  <g transform="translate(4, 4) scale(1.45)" fill="#FFFFFF">
    <ellipse cx="6"  cy="6"  rx="1.7" ry="2.3" transform="rotate(-25 6 6)"/>
    <ellipse cx="11" cy="2.8" rx="1.7" ry="2.3"/>
    <ellipse cx="16" cy="6"  rx="1.7" ry="2.3" transform="rotate(25 16 6)"/>
    <path d="M 4.5 12.5 Q 4.5 9.8, 7.8 9.3 L 14.2 9.3 Q 17.5 9.8, 17.5 12.5 Q 17.5 17.2, 11 18.2 Q 4.5 17.2, 4.5 12.5 Z"/>
  </g>

  <!-- Tiny ice crystal on the metacarpal pad (centered roughly at 19.5, 21 in svg coords) -->
  <g transform="translate(19.5, 21)" stroke="#3565A8" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M 0 -1.8 L 0 1.8 M -1.8 0 L 1.8 0 M -1.25 -1.25 L 1.25 1.25 M 1.25 -1.25 L -1.25 1.25"/>
  </g>
</svg>