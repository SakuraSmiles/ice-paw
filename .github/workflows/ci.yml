name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Rust check, test, clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup component add clippy

      - name: Cargo cache (registries only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/app/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          # libsodium-sys-stable v1.24.0 bundled C 编译在 CI GCC 上不稳定
          # 从源码安装 libsodium 1.0.20，提供稳定可用的静态库
          curl -sL https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz | tar xz -C /tmp
          cd /tmp/libsodium-1.0.20
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          # 清理
          cd / && rm -rf /tmp/libsodium-1.0.20*

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcactions /usr/share/swift /usr/local/share/boost
          sudo apt-get clean
          df -h

      # 统一使用 ci profile 共享编译产物
      - name: cargo check (ci)
        run: cargo check --profile ci

      - name: cargo test
        run: "cargo test --profile ci --lib && cargo test --profile ci --test provider_test && cargo test --profile ci --test message_repo_test && cargo test --profile ci --test memory_e2e"

      - name: cargo clippy
        run: "cargo clippy --profile ci --lib -- -D warnings"

      - name: cargo clippy - tests
        run: "cargo clippy --profile ci --tests -- -D warnings"

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @ice-paw/ui
        run: "pnpm --filter @ice-paw/ui build"

      - name: Typecheck
        run: pnpm --filter @ice-paw/app typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
