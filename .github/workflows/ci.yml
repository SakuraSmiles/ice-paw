name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # libsodium-sys-stable 构建脚本：设置此环境变量则跳过 bundled 编译，直接链接系统库
  SODIUM_LIB_DIR: /usr/lib/x86_64-linux-gnu

jobs:
  backend:
    name: Rust check, test, clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup component add clippy

      - name: Cargo cache (registries only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/app/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsodium-dev
          # libsodium-sys-stable v1.24.0 在某些 CI 环境下 bundled C 编译不稳定，
          # 确保 pkg-config 能找到系统 libsodium
          pkg-config --libs --cflags libsodium
          ls -la /usr/lib/x86_64-linux-gnu/libsodium* /usr/lib/libsodium* 2>/dev/null || true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcactions /usr/share/swift /usr/local/share/boost
          sudo apt-get clean
          df -h

      # 统一使用 ci profile 共享编译产物
      - name: cargo check (ci)
        run: cargo check --profile ci

      - name: cargo test
        run: "cargo test --profile ci --lib && cargo test --profile ci --test provider_test && cargo test --profile ci --test message_repo_test && cargo test --profile ci --test memory_e2e"

      - name: cargo clippy
        run: "cargo clippy --profile ci --lib -- -D warnings"

      - name: cargo clippy - tests
        run: "cargo clippy --profile ci --tests -- -D warnings"

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @ice-paw/ui
        run: "pnpm --filter @ice-paw/ui build"

      - name: Typecheck
        run: pnpm --filter @ice-paw/app typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
